# Test settings for this folder only; run from here: cd cnn_head && pytest
# Lint and formatting follow the main repository (ruff / black from its root).
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=aes_head --cov-branch --cov-report=term-missing --cov-fail-under=80"
